name: OpenSpiderSolitaire

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

options:
  bundleIdPrefix: com.openspidersolitaire
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # iPhone only (PRD "Platform & Scope"). This has to be repeated on every
    # target below: XcodeGen's iOS setting presets write "1,2" at the *target*
    # level, which beats anything set here at the project level.
    TARGETED_DEVICE_FAMILY: "1"
    # DEVELOPMENT_TEAM is deliberately NOT set here: it is personal, and this
    # repo is public. It comes from Config/Signing.xcconfig, which optionally
    # includes the gitignored Config/Signing.local.xcconfig. See that file.
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  OpenSpiderSolitaire:
    type: application
    platform: iOS
    sources:
      - src/OpenSpiderSolitaire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openspidersolitaire.OpenSpiderSolitaire
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Xcode's General tab writes these into the generated .xcodeproj, which is
        # gitignored and rebuilt by `xcodegen generate` — so they only stick here.
        INFOPLIST_KEY_CFBundleDisplayName: Open Spider Solitaire
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.card-games
        MARKETING_VERSION: "1.0.0"       # General tab → Version
        CURRENT_PROJECT_VERSION: "1.0.0" # General tab → Build
        # Both orientations (PRD), iPhone
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight

  OpenSpiderSolitaireTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - src/OpenSpiderSolitaireTests
    dependencies:
      - target: OpenSpiderSolitaire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openspidersolitaire.OpenSpiderSolitaireTests
        TARGETED_DEVICE_FAMILY: "1"      # match the host app
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OpenSpiderSolitaire:
    build:
      targets:
        OpenSpiderSolitaire: all
    run:
      config: Debug
    test:
      targets:
        - OpenSpiderSolitaireTests
