name: OpenSpiderSolitaire

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

options:
  bundleIdPrefix: com.openspidersolitaire
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # iPhone only (PRD "Platform & Scope"). This has to be repeated on every
    # target below: XcodeGen's iOS setting presets write "1,2" at the *target*
    # level, which beats anything set here at the project level.
    TARGETED_DEVICE_FAMILY: "1"
    # DEVELOPMENT_TEAM is deliberately NOT set here: it is personal, and this
    # repo is public. It comes from Config/Signing.xcconfig, which optionally
    # includes the gitignored Config/Signing.local.xcconfig. See that file.
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  OpenSpiderSolitaire:
    type: application
    platform: iOS
    sources:
      - src/OpenSpiderSolitaire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openspidersolitaire.OpenSpiderSolitaire
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Answers App Store Connect's export-compliance question up front, so
        # it stops asking on every upload. True here: the app makes no network
        # calls and uses no crypto APIs at all (see Core/Networking/README.md).
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Xcode's General tab writes these into the generated .xcodeproj, which is
        # gitignored and rebuilt by `xcodegen generate` — so they only stick here.
        # The name under the icon ONLY. The product is "Open Spider Solitaire"
        # - that is the App Store Connect listing name, the title screen, and
        # the docs - but it truncates on the home screen, so the label is
        # shortened here. ("Open Spider" alone is already taken on the App
        # Store, which is why the product keeps the longer name.)
        #
        # CFBundleName is deliberately NOT set alongside it: the generated
        # Info.plist always derives it from PRODUCT_NAME, so
        # INFOPLIST_KEY_CFBundleName is accepted as a build setting and then
        # ignored. Renaming PRODUCT_NAME would fix it but also rename the .app
        # and break the TEST_HOST path XcodeGen derives from the target name.
        # It only matters as a fallback for when CFBundleDisplayName is absent,
        # and it is not.
        INFOPLIST_KEY_CFBundleDisplayName: Open Spider
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.card-games
        MARKETING_VERSION: "1.0.0"       # General tab → Version
        CURRENT_PROJECT_VERSION: "1.0.0" # General tab → Build
        # Both orientations (PRD), iPhone
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight

  OpenSpiderSolitaireTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - src/OpenSpiderSolitaireTests
    dependencies:
      - target: OpenSpiderSolitaire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openspidersolitaire.OpenSpiderSolitaireTests
        TARGETED_DEVICE_FAMILY: "1"      # match the host app
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OpenSpiderSolitaire:
    build:
      targets:
        OpenSpiderSolitaire: all
    run:
      config: Debug
    test:
      targets:
        - OpenSpiderSolitaireTests
