name: OpenSpiderSolitaire

options:
  bundleIdPrefix: com.davidbettis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only (PRD)
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  OpenSpiderSolitaire:
    type: application
    platform: iOS
    sources:
      - src/OpenSpiderSolitaire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidbettis.OpenSpiderSolitaire
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spider
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Both orientations (PRD), iPhone
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight

  OpenSpiderSolitaireTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - src/OpenSpiderSolitaireTests
    dependencies:
      - target: OpenSpiderSolitaire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidbettis.OpenSpiderSolitaireTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OpenSpiderSolitaire:
    build:
      targets:
        OpenSpiderSolitaire: all
    run:
      config: Debug
    test:
      targets:
        - OpenSpiderSolitaireTests
